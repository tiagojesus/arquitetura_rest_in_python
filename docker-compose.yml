services:
  api:
    build: .
    container_name: rest_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_NAME: ${APP_NAME:-Arquitetura REST}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./app:/code/app # hot-reload em desenvolvimento
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  tests:
    build: .
    container_name: rest_api_tests
    profiles: ["tests"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
    depends_on:
      db:
        condition: service_healthy
    command: pytest -v

  tools:
    build: .
    profiles: ["tools"]
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./pyproject.toml:/code/pyproject.toml
    entrypoint: ["uv"]

  db:
    image: postgres:16-alpine
    container_name: rest_api_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Garante banco criado em UTF-8 (válido apenas na 1ª inicialização do volume)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
